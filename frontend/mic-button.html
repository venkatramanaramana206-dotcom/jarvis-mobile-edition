
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b14">
  <title>JARVIS Voice Control</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app-container">
    <header class="top-bar">
      <div class="brand-block">
        <div class="brand-name">J.A.R.V.I.S.</div>
        <div id="micSystemStatus" class="system-status">
          VOICE SYSTEM READY
        </div>
      </div>
    </header>

    <section class="hero-section">
      <div id="micHudOrb" class="hud-orb" aria-hidden="true">
        <div class="orb-ring ring-one"></div>
        <div class="orb-ring ring-two"></div>
        <div class="orb-ring ring-three"></div>
        <div class="orb-core">
          <div class="core-diamond"></div>
        </div>
      </div>

      <h1>Voice Command</h1>
      <p>Speak to your personal AI assistant</p>

      <p id="micStatus" class="listening-status" aria-live="polite">
        Tap the microphone to begin.
      </p>

      <div class="voice-controls">
        <button
          id="startMic"
          type="button"
          class="control-button"
          aria-pressed="false"
        >
          <span class="control-icon" aria-hidden="true">🎙️</span>
          <span>Start Listening</span>
        </button>

        <button id="stopMic" type="button" class="control-button">
          <span class="control-icon" aria-hidden="true">■</span>
          <span>Stop Listening</span>
        </button>
      </div>
    </section>

    <section class="chat-section">
      <label for="recognizedText">Recognized speech</label>
      <div class="chat-form">
        <textarea
          id="recognizedText"
          rows="3"
          placeholder="Your spoken words will appear here..."
          readonly
        ></textarea>
      </div>

      <p class="footer-note">
        MICROPHONE PERMISSION REQUIRED
      </p>
    </section>
  </main>

  <script>
    (() => {
      const startButton = document.getElementById("startMic");
      const stopButton = document.getElementById("stopMic");
      const status = document.getElementById("micStatus");
      const systemStatus = document.getElementById("micSystemStatus");
      const output = document.getElementById("recognizedText");
      const orb = document.getElementById("micHudOrb");

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      let recognition = null;
      let isListening = false;

      function setStatus(title, message, active = false) {
        systemStatus.textContent = title;
        status.textContent = message;

        orb.classList.toggle("listening", active);
        startButton.setAttribute(
          "aria-pressed",
          String(active)
        );
      }

      function stopListening() {
        if (recognition && isListening) {
          recognition.stop();
        }

        isListening = false;
        setStatus("VOICE SYSTEM READY", "Listening stopped.");
      }

      startButton.addEventListener("click", () => {
        if (!SpeechRecognition) {
          setStatus(
            "VOICE UNAVAILABLE",
            "This browser does not support speech recognition. Try a compatible browser."
          );
          return;
        }

        if (isListening) return;

        recognition = new SpeechRecognition();
        recognition.lang = "te-IN";
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          isListening = true;
          setStatus(
            "LISTENING",
            "Listening now. Speak clearly.",
            true
          );
        };

        recognition.onresult = (event) => {
          let transcript = "";

          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {
            transcript += event.results[i][0].transcript;
          }

          output.value = transcript.trim();
        };

        recognition.onerror = (event) => {
          const message = event.error === "not-allowed"
            ? "Microphone permission denied. Allow microphone access in your browser."
            : "Speech recognition error: " + event.error;

          setStatus("VOICE ERROR", message);
        };

        recognition.onend = () => {
          isListening = false;

          if (orb) orb.classList.remove("listening");

          startButton.setAttribute("aria-pressed", "false");

          if (systemStatus.textContent === "LISTENING") {
            setStatus(
              "VOICE SYSTEM READY",
              output.value
                ? "Speech captured."
                : "No speech captured. Try again."
            );
          }
        };

        try {
          recognition.start();
        } catch {
          setStatus(
            "VOICE ERROR",
            "Could not start the microphone. Try again."
          );
        }
      });

      stopButton.addEventListener("click", stopListening);
    })();
  </script>
</body>
</html>
