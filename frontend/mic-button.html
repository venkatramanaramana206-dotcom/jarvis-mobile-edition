 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020812">
  <title>JARVIS - Microphone Control</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    .mic-page {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .mic-heading {
      color: #58eaff;
      font-family: Orbitron, sans-serif;
      font-size: 23px;
      margin-bottom: 10px;
    }

    .mic-description {
      color: #8ca8ba;
      font-size: 13px;
      line-height: 1.6;
      max-width: 300px;
    }

    .mic-glow {
      width: 150px;
      height: 150px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(88, 234, 255, .65);
      box-shadow: 0 0 25px #00cfff55, inset 0 0 30px #00cfff22;
      margin: 28px 0;
    }

    #standalone-mic {
      width: 108px;
      height: 108px;
      border: 1px solid #58eaff;
      border-radius: 50%;
      color: #eafaff;
      background: radial-gradient(circle, #12506a, #03111e);
      box-shadow: 0 0 22px #00cfff55;
      font-size: 35px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }

    #standalone-mic:active {
      transform: scale(.94);
    }

    #standalone-mic.listening {
      background: radial-gradient(circle, #7c2435, #190711);
      border-color: #ff7185;
      box-shadow: 0 0 30px #ff526788;
      animation: mic-pulse 1.2s infinite;
    }

    #mic-status {
      color: #58eaff;
      font-family: Orbitron, sans-serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      margin: 12px 0;
    }

    #mic-result {
      color: #eafaff;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
      max-width: 340px;
      min-height: 24px;
    }

    .mic-back {
      color: #58eaff;
      text-decoration: none;
      font-size: 13px;
      margin-top: 25px;
    }

    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>

<body>
  <main class="mic-page">

    <h1 class="mic-heading">J.A.R.V.I.S.</h1>

    <p class="mic-description">
      Voice command interface. Tap the microphone
      and speak when the system is ready.
    </p>

    <div class="mic-glow">
      <button
        id="standalone-mic"
        type="button"
        aria-label="Start voice recognition"
        aria-pressed="false">
        🎙
      </button>
    </div>

    <div id="mic-status" role="status" aria-live="polite">
      SYSTEM STANDBY
    </div>

    <p id="mic-result" aria-live="polite">
      Your recognized speech will appear here.
    </p>

    <a class="mic-back" href="../index.html">
      ← Back to JARVIS
    </a>

  </main>

  <script>
    (() => {
      const button = document.getElementById("standalone-mic");
      const status = document.getElementById("mic-status");
      const result = document.getElementById("mic-result");

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      let recognition = null;
      let listening = false;

      function setListening(active) {
        listening = active;
        button.classList.toggle("listening", active);
        button.setAttribute("aria-pressed", String(active));
        button.setAttribute(
          "aria-label",
          active ? "Stop voice recognition" : "Start voice recognition"
        );
      }

      if (!SpeechRecognition) {
        status.textContent = "VOICE RECOGNITION UNSUPPORTED";
        result.textContent =
          "This browser does not support speech recognition. " +
          "Try a compatible browser or use the main JARVIS chat.";
        button.addEventListener("click", () => {
          status.textContent = "UNSUPPORTED";
        });
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = navigator.language || "en-US";
      recognition.interimResults = true;
      recognition.continuous = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        setListening(true);
        status.textContent = "LISTENING...";
        result.textContent = "Speak now...";
      };

      recognition.onresult = (event) => {
        let transcript = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }

        result.textContent = transcript;
      };

      recognition.onerror = (event) => {
        status.textContent = "VOICE INPUT ERROR";
        result.textContent =
          "Error: " + event.error +
          ". Check microphone permission and try again.";
      };

      recognition.onend = () => {
        setListening(false);

        if (status.textContent === "LISTENING...") {
          status.textContent = "SYSTEM STANDBY";
        }
      };

      button.addEventListener("click", () => {
        if (listening) {
          recognition.stop();
          return;
        }

        try {
          recognition.start();
        } catch (error) {
          status.textContent = "PLEASE TRY AGAIN";
          result.textContent =
            "Voice input could not start. Check permissions and retry.";
        }
      });
    })();
  </script>
</body>
</html>
